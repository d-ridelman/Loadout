[package]
name = "ctxkit"
version = "0.1.0"
edition = "2021"
description = "Surgical context and token toolkit for Claude Code, Claude Desktop, Antigravity, and DeepSeek Harness"
license = "MIT"
repository = "https://github.com/d-ridelman/ctxkit"
readme = "README.md"
keywords = ["claude-code", "antigravity", "tokens", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
