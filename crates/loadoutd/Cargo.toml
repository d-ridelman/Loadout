[package]
name = "loadoutd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "loadout: CLI (scan, prune) and the sidecar process of the Loadout window (serve, JSON-RPC over stdio)"

# The binary is called `loadout`: the CLI (`scan`, `prune`) and the window's core process (`loadout serve`, JSON-RPC over stdio).
[[bin]]
name = "loadout"
path = "src/main.rs"

[dependencies]
loadout-core = { path = "../loadout-core" }
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
