[workspace]
members = ["crates/loadout-core", "crates/loadoutd", "crates/context-toolkit"]
resolver = "2"

# The profile belongs to the workspace: the former [profile.release] of the context-toolkit crate (fast hook start, small binary) was moved here
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
authors = ["Loadout contributors"]
repository = "https://github.com/d-ridelman/Loadout"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
jsonc-parser = "0.26"
sha2 = "0.10"
notify = "8"
yaml-rust2 = "0.10"
