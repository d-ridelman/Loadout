[workspace]
members = ["crates/loadout-core", "crates/loadoutd"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
jsonc-parser = "0.26"
sha2 = "0.10"
notify = "8"
yaml-rust2 = "0.10"
