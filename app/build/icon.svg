<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Loadout</title>
  <!-- панель и угловые скобки: тот же язык, что у панелей окна (HUD) -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#21222c" stroke="#44475a" stroke-width="2"/>
  <path d="M10 22V13a3 3 0 0 1 3-3h9M42 10h9a3 3 0 0 1 3 3v9M54 42v9a3 3 0 0 1-3 3h-9M22 54h-9a3 3 0 0 1-3-3v-9" fill="none" stroke="#8be9fd" stroke-width="3" stroke-linecap="round"/>
  <!-- LOAD: загружено (●), как в матрице -->
  <circle cx="20" cy="22" r="3.6" fill="#50fa7b"/>
  <circle cx="20" cy="32" r="3.6" fill="#50fa7b"/>
  <circle cx="20" cy="42" r="3.6" fill="#50fa7b"/>
  <!-- OUT: выключено (○) -->
  <circle cx="44" cy="22" r="3" fill="none" stroke="#6272a4" stroke-width="2"/>
  <circle cx="44" cy="32" r="3" fill="none" stroke="#6272a4" stroke-width="2"/>
  <circle cx="44" cy="42" r="3" fill="none" stroke="#6272a4" stroke-width="2"/>
  <!-- слэш из названия LOAD/OUT -->
  <path d="M28 46 36 18" stroke="#ff79c6" stroke-width="4" stroke-linecap="round"/>
</svg>
